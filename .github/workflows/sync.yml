name: Discord to Google Sheet

on:
  schedule:
    # Every 15 minutes. GitHub queues cron jobs on a best-effort basis, so
    # actual runs can drift by 5-20 minutes during busy periods.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "new = only messages since the last run; backfill = pull existing history"
        type: choice
        options:
          - new
          - backfill
        default: new

permissions:
  contents: write

concurrency:
  group: discord-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync messages
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
          DISCORD_CHANNEL_IDS: ${{ vars.DISCORD_CHANNEL_IDS }}
          SYNC_MODE: ${{ inputs.mode || 'new' }}
          MAX_MESSAGES_PER_RUN: "2000"
          # Nothing older than this date is archived. Override with a repository
          # variable named ARCHIVE_SINCE, or clear it to allow full history.
          ARCHIVE_SINCE: ${{ vars.ARCHIVE_SINCE || '2026-09-01' }}
        run: python sync.py

      - name: Save cursor
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: update sync cursor"
            git push
          else
            echo "No cursor change."
          fi
